<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Request Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
      <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <div class="text-center">
          <h1 class="text-2xl font-bold mb-4">
            Your request is being reviewed
          </h1>
          <p class="text-gray-600 mb-6">
            Please wait while we process your request. This should only take a
            few moments.
          </p>
          <div class="flex items-center justify-center space-x-2">
            <i class="fas fa-at-circle text-gray-600"></i>
            <span id="receivedTime"
              >Your request was received at <span id="requestTime"></span
            ></span>
          </div>
          <a
            href="/logout"
            class="mt-6 inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
            ><i class="fas fa-sign-out-alt mr-2"></i>Logout</a
          >
        </div>
      </div>
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function updateTime() {
          var now = new Date();
          var timeString = now.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
          });
          document.getElementById("requestTime").textContent = timeString;
        }
        updateTime();
        setInterval(updateTime, 60000);
      });
    </script>
  </body>
</html>
