<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DidatticaUz</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center py-4">
          <div class="flex items-center">
            <img
              src="{% static 'images/logo1.png' %}"
              alt="Turin Polito"
              class="h-10"
            />
          </div>
          <div class="hidden md:flex space-x-4">
            <a
              href="/teachers/teacher-dashboard"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-home mr-2"></i>Dashboard
            </a>
            <a
              href="/teachers/teacher-exam"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-book mr-2"></i>Courses
            </a>
            <a
              href="/teachers/teacher-question"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-question-circle mr-2"></i>Questions
            </a>
            <a
              href="/logout"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </a>
          </div>
          <button class="md:hidden focus:outline-none">
            <span class="block w-6 h-1 bg-gray-700 mb-1"></span>
            <span class="block w-6 h-1 bg-gray-700 mb-1"></span>
            <span class="block w-6 h-1 bg-gray-700"></span>
          </button>
        </div>
      </div>
    </nav>
    {% block content %} {% endblock %}
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const navToggle = document.querySelector(".md\\:hidden");
        const navMenu = document.querySelector(".md\\:flex");

        navToggle.addEventListener("click", function () {
          navMenu.classList.toggle("hidden");
        });
      });
    </script>
  </body>
</html>
