{% extends 'teachers/teacherbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Add Course</h1>
    <form method="POST" autocomplete="off" class="space-y-4">
      {% csrf_token %}
      <div class="space-y-2">
        <div>
          <label class="text-gray-600">Course Name</label>
          <input
            type="text"
            id="course_name"
            name="course_name"
            placeholder="Ex: Circuit Theory"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Total Question</label>
          <input
            type="number"
            id="question_number"
            name="question_number"
            placeholder="Ex: 20"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Total Marks</label>
          <input
            type="number"
            id="total_marks"
            name="total_marks"
            placeholder="Ex: 30"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Credit</label>
          <input
            type="number"
            id="credit"
            name="credit"
            placeholder="Ex: 8"
            required
            class="w-full p-2 border rounded"
          />
        </div>
      </div>
      <button
        type="submit"
        class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
      >
        Submit Course
      </button>
    </form>
  </div>
</div>
{% endblock %}
