{% extends 'teachers/teacherbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Add Question</h1>
    <form
      method="POST"
      enctype="multipart/form-data"
      autocomplete="off"
      class="space-y-4"
    >
      {% csrf_token %}
      <div class="space-y-2">
        <div>
          <label class="text-gray-600">Course</label>
          <select
            id="courseID"
            name="courseID"
            required
            class="w-full p-2 border rounded"
          >
            <!-- Add options here -->
          </select>
        </div>
        <div>
          <label class="text-gray-600">Question</label>
          <input
            type="text"
            id="question"
            name="question"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Image</label>
          <input type="file" name="picture" class="w-full p-2 border rounded" />
        </div>
        <div>
          <label class="text-gray-600">Marks</label>
          <input
            type="number"
            id="marks"
            name="marks"
            placeholder="Ex: 3 points"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Option 1</label>
          <input
            type="text"
            id="option1"
            name="option1"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Option 2</label>
          <input
            type="text"
            id="option2"
            name="option2"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Option 3</label>
          <input
            type="text"
            id="option3"
            name="option3"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Option 4</label>
          <input
            type="text"
            id="option4"
            name="option4"
            required
            class="w-full p-2 border rounded"
          />
        </div>
        <div>
          <label class="text-gray-600">Correct Answer</label>
          <select
            id="answer"
            name="answer"
            required
            class="w-full p-2 border rounded"
          >
            <option value="Option1">Option 1</option>
            <option value="Option2">Option 2</option>
            <option value="Option3">Option 3</option>
            <option value="Option4">Option 4</option>
          </select>
        </div>
      </div>
      <button
        type="submit"
        class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
      >
        Submit Question
      </button>
    </form>
  </div>
</div>
{% endblock %}
