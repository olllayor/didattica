{% extends 'teachers/teacherbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Available Questions</h1>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b">Course Name</th>
            <th class="py-2 px-4 border-b">Total Question</th>
            <th class="py-2 px-4 border-b">Total Marks</th>
            <th class="py-2 px-4 border-b">View</th>
          </tr>
        </thead>
        <tbody>
          {% for c in courses %}
          <tr>
            <td class="py-2 px-4 border-b">{{c.course_name}}</td>
            <td class="py-2 px-4 border-b">{{c.question_number}}</td>
            <td class="py-2 px-4 border-b">{{c.total_marks}}</td>
            <td class="py-2 px-4 border-b">
              <a
                href="{% url 'see-question' c.id  %}"
                class="text-blue-500 hover:text-blue-700"
              >
                <i class="fa fa-eye"></i>
              </a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="4" class="py-2 px-4 border-b text-center">
              There are no question yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
