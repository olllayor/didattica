{% extends 'exams/adminbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Available Questions</h1>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b">Questions</th>
            <th class="py-2 px-4 border-b">Mark</th>
            <th class="py-2 px-4 border-b">Action</th>
          </tr>
        </thead>
        <tbody>
          {% for c in questions %}
          <tr>
            <td class="py-2 px-4 border-b">{{c.question}}</td>
            <td class="py-2 px-4 border-b">{{c.marks}}</td>
            <td class="py-2 px-4 border-b">
              <a
                href="{% url 'delete-question' c.id  %}"
                class="text-red-500 hover:text-red-700"
              >
                <i class="fas fa-trash"></i>
              </a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="3" class="py-2 px-4 border-b text-center">
              There is no question yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
