{% extends 'exams/adminbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Registered Students</h1>
    <div class="overflow-x-auto">
      <table class="min-w-full bg-white">
        <thead>
          <tr>
            <th class="py-2 px-4 border-b">Name</th>
            <th class="py-2 px-4 border-b">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for t in students %}
          <tr>
            <td class="py-2 px-4 border-b">{{t.get_name}}</td>
            <td class="py-2 px-4 border-b">
              <a
                href="{% url 'admin-view-marks' t.id  %}"
                class="text-blue-500 hover:text-blue-700"
                >View Marks</a
              >
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="2" class="py-2 px-4 border-b text-center">
              There are no marks yet.
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
