{% extends 'exams/adminbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Teachers</h1>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Teachers</h2>
        <p class="text-gray-600">Total approved teachers - {{total_teacher}}</p>
        <a
          href="admin-view-teacher"
          class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
          >View Teachers</a
        >
      </div>
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Pending Teachers</h2>
        <p class="text-gray-600">Waiting for approved - {{pending_teacher}}</p>
        <a
          href="admin-view-pending-teacher"
          class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
          >View Teachers</a
        >
      </div>
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Total Salary</h2>
        <p class="text-gray-600">Total teacher's salary - ${{salary}}</p>
        <a
          href="admin-view-teacher-salary"
          class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
          >View Salary</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
