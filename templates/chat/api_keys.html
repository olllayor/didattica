{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Keys</title>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-50 text-gray-900">
    <div class="flex min-h-screen">
      {% include 'chat/sidebar.html' %}

      <main class="flex-grow border-l border-r border-gray-200">
        <div class="max-w-2xl mx-auto p-4">
          <h2 class="text-2xl font-bold mb-4">API Keys</h2>
          <form method="POST">
            {% csrf_token %} {% for field in form %}
            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="{{ field.id_for_label }}"
                >{{ field.label }}</label
              >
              <div class="relative">
                <input
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline pr-10"
                  id="{{ field.id_for_label }}"
                  type="password"
                  placeholder="Enter {{ field.label }} API Key"
                  name="{{ field.name }}"
                  value="{{ field.value|default:'' }}"
                />
                <button
                  type="button"
                  class="toggle-visibility absolute inset-y-0 right-0 flex items-center px-2"
                  data-target="{{ field.id_for_label }}"
                >
                  <i class="fas fa-eye text-gray-500"></i>
                </button>
              </div>
            </div>
            {% endfor %}
            <div class="flex justify-end">
              <button
                type="button"
                class="bg-gray-300 text-gray-800 py-2 px-4 rounded-lg mr-2"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="bg-blue-400 text-white py-2 px-4 rounded-lg"
              >
                Save
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const toggleButtons = document.querySelectorAll(".toggle-visibility");
        toggleButtons.forEach((button) => {
          button.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target");
            const inputField = document.getElementById(targetId);
            if (inputField.type === "password") {
              inputField.type = "text";
              this.innerHTML = '<i class="fas fa-eye-slash text-gray-500"></i>';
            } else {
              inputField.type = "password";
              this.innerHTML = '<i class="fas fa-eye text-gray-500"></i>';
            }
          });
        });
      });
    </script>
  </body>
</html>
