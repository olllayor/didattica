{% extends 'students/studentbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Start Exam</h1>
    <form
      class="space-y-4"
      autocomplete="off"
      onsubmit="return saveAns()"
      action="/students/calculate-marks"
      method="POST"
    >
      {% csrf_token %} {% for q in questions %}
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <p class="text-gray-900">
          <span class="font-semibold">{{ forloop.counter }}.</span>
          {{ q.question }}
        </p>
        {% if q.picture %}
        <div class="mt-2">
          <img
            src="{{ q.picture }}"
            alt="Question Image"
            class="w-full h-auto rounded-lg"
          />
        </div>
        {% endif %}
        <div class="mt-2 text-right">
          <h4 class="text-gray-600">{{q.marks}} Marks</h4>
        </div>
        <div class="space-y-2 mt-4">
          <label class="flex items-center">
            <input
              type="radio"
              name="question_{{ forloop.counter }}"
              value="Option1"
              class="mr-2"
            />
            {{ q.option1 }}
          </label>
          <label class="flex items-center">
            <input
              type="radio"
              name="question_{{ forloop.counter }}"
              value="Option2"
              class="mr-2"
            />
            {{ q.option2 }}
          </label>
          <label class="flex items-center">
            <input
              type="radio"
              name="question_{{ forloop.counter }}"
              value="Option3"
              class="mr-2"
            />
            {{ q.option3 }}
          </label>
          <label class="flex items-center">
            <input
              type="radio"
              name="question_{{ forloop.counter }}"
              value="Option4"
              class="mr-2"
            />
            {{ q.option4 }}
          </label>
        </div>
      </div>
      {% endfor %}
      <input
        type="submit"
        value="Submit Answers"
        class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
      />
    </form>
  </div>
</div>
<script>
  function saveAns() {
    const questions = document.querySelectorAll(".bg-gray-50");
    questions.forEach((question, index) => {
      const name = `question_${index + 1}`;
      const selectedOption = document.querySelector(
        `input[name="${name}"]:checked`
      );
      if (selectedOption) {
        const value = selectedOption.value;
        document.cookie = `${index + 1}=${value}; path=/`;
      }
    });
    return true; // Proceed with form submission
  }
  function setCookie(cname, cvalue, exdays) {
    var d = new Date();
    d.setTime(d.getTime() + exdays * 24 * 60 * 60 * 1000);
    var expires = "expires=" + d.toUTCString();
    document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
  }
</script>
{% endblock %}
