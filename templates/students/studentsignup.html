<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <section class="min-h-screen flex items-center justify-center">
      <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <form
          method="POST"
          autocomplete="off"
          enctype="multipart/form-data"
          class="space-y-4"
          onsubmit="return validateForm()"
        >
          {% csrf_token %}
          <h2 class="text-2xl font-bold text-center mb-4">Sign Up</h2>
          <div class="space-y-2">
            <div>
              <label class="text-gray-600">First Name</label>
              <input
                type="text"
                id="first_name"
                name="first_name"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Last Name</label>
              <input
                type="text"
                id="last_name"
                name="last_name"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Phone Number</label>
              <input
                type="tel"
                id="mobile"
                name="mobile"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Student ID</label>
              <input
                type="text"
                id="student_id"
                name="student_id"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                class="w-full p-2 border rounded"
              />
            </div>
            <div>
              <label class="text-gray-600">Confirm Password</label>
              <input
                type="password"
                id="password1"
                name="password1"
                required
                class="w-full p-2 border rounded"
              />
              <span id="passwordError" class="text-red-500"></span>
            </div>
          </div>
          <button
            type="submit"
            class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
          >
            Sign Up
          </button>
          <div class="text-center">
            <p class="text-gray-600">
              Already have an account?
              <a
                href="{% url 'studentlogin' %}"
                class="text-blue-500 hover:text-blue-700"
                >Login</a
              >
            </p>
          </div>
        </form>
      </div>
    </section>
    <script>
      var togglePassword = document.getElementById("togglePassword");
      var toggleConfirmPassword = document.getElementById(
        "toggleConfirmPassword"
      );
      var password = document.getElementById("password");
      var confirmPassword = document.getElementById("password1");

      togglePassword.addEventListener("click", function () {
        var type =
          password.getAttribute("type") === "password" ? "text" : "password";
        password.setAttribute("type", type);
        togglePassword.classList.toggle("ion-eye-off-outline");
      });

      toggleConfirmPassword.addEventListener("click", function () {
        var type =
          confirmPassword.getAttribute("type") === "password"
            ? "text"
            : "password";
        confirmPassword.setAttribute("type", type);
        toggleConfirmPassword.classList.toggle("ion-eye-off-outline");
      });

      function validateForm() {
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("password1").value;
        if (password != confirmPassword) {
          document.getElementById("passwordError").innerHTML =
            "Passwords do not match.";
          return false;
        }
        return true;
      }
    </script>
  </body>
</html>
