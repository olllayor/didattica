<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DidatticaUz</title>
    <link
      rel="icon"
      href="{% static 'images/favicon.jpg' %}"
      type="image/jpg"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center py-4">
          <div class="flex items-center">
            <img
              src="{% static 'images/logo1.png' %}"
              alt="Turin Polito"
              class="h-10"
            />
          </div>
          <div class="hidden md:flex space-x-4">
            <a
              href="/students/student-dashboard"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-user mr-2"></i>Profile
            </a>
            <a
              href="/students/student-exam"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-book mr-2"></i>Exams
            </a>
            <a
              href="/students/student-marks"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fa fa-list-alt mr-2"></i>Results
            </a>
            <a
              href="/logout"
              class="text-gray-700 hover:text-blue-500 flex items-center"
            >
              <i class="fas fa-sign-out-alt mr-2"></i>Logout
            </a>
          </div>
          <button class="md:hidden focus:outline-none">
            <span class="block w-6 h-1 bg-gray-700 mb-1"></span>
            <span class="block w-6 h-1 bg-gray-700 mb-1"></span>
            <span class="block w-6 h-1 bg-gray-700"></span>
          </button>
        </div>
      </div>
    </nav>
    <div class="max-w-6xl mx-auto px-4 py-6">
      <div class="bg-white p-6 rounded-lg shadow-md">
        <div class="flex items-center space-x-4">
          <img
            src="{% static 'images/student_id.jpg' %}"
            alt="Student Image"
            class="w-16 h-16 rounded-full"
          />
          <div>
            <p class="text-gray-700">
              Student ID: <b>{{ request.user.student.student_id }}</b>
            </p>
            <p class="text-gray-900 font-semibold">
              {{ request.user.first_name|add:" "|add:request.user.last_name }}
            </p>
          </div>
        </div>
      </div>
      {% block content %} {% endblock %}
    </div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const navToggle = document.querySelector(".md\\:hidden");
        const navMenu = document.querySelector(".md\\:flex");

        navToggle.addEventListener("click", function () {
          navMenu.classList.toggle("hidden");
        });
      });
    </script>
  </body>
</html>
