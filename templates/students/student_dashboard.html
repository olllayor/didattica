{% extends 'students/studentbase.html' %} {% block content %}
<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-2xl font-bold mb-6">Student Dashboard</h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">
          <i class="fas fa-user mr-2"></i>Personal Information
        </h2>
        <div class="space-y-2">
          <div>
            <label class="text-gray-600">First name</label>
            <input
              type="text"
              value="{{request.user.first_name}}"
              disabled
              class="w-full p-2 border rounded"
            />
          </div>
          <div>
            <label class="text-gray-600">Last name</label>
            <input
              type="text"
              value="{{request.user.last_name}}"
              disabled
              class="w-full p-2 border rounded"
            />
          </div>
        </div>
      </div>
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">
          <i class="fas fa-phone mr-2"></i>Contact Information
        </h2>
        <div class="space-y-2">
          <div>
            <label class="text-gray-600">Phone</label>
            <input
              type="tel"
              value="{{student.mobile}}"
              disabled
              class="w-full p-2 border rounded"
            />
          </div>
        </div>
      </div>
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">
          <i class="fas fa-graduation-cap mr-2"></i>Academic Progress (Beta)
        </h2>
        <div class="space-y-2">
          <div>
            <label class="text-gray-600">GPA</label>
            <input
              type="text"
              value="3.5"
              disabled
              class="w-full p-2 border rounded"
            />
          </div>
          <div>
            <label class="text-gray-600">Completed Credits</label>
            <input
              type="text"
              value="60/180"
              disabled
              class="w-full p-2 border rounded"
            />
          </div>
        </div>
      </div>
      <div class="bg-gray-50 p-4 rounded-lg shadow-sm">
        <h2 class="text-xl font-semibold mb-4">Upgrade to Pro</h2>
        <p class="text-gray-600 mb-4">
          Unlock all features and get unlimited access to our support team
        </p>
        <p class="text-gray-600 mb-4">COMING SOON</p>
        <a
          href="/students/student-pro"
          class="inline-block bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600"
          >Upgrade</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
